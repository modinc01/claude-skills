<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>スライド動画テンプレート</title>
<!-- フォントはローカル同梱にする: assets/fonts/noto-local.css（@font-face で woff2 を相対参照） -->
<link rel="stylesheet" href="assets/fonts/noto-local.css">
<style>
html,body{width:1920px;height:1080px;overflow:hidden;margin:0;background:#f6f8fc;font-family:"Noto Sans JP","Hiragino Sans",sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0}
.slide h1{font-size:72px;margin:0;padding:200px 160px 0;line-height:1.3;color:#1a1a1a}
.slide p{font-size:40px;padding:40px 160px 0;color:#444;line-height:1.6}
.topbar{position:absolute;left:0;top:0;right:0;height:72px;display:flex;align-items:center;padding:0 60px}
.topbar img{height:34px}
</style></head><body><div id="stage">
<div class="topbar"><img src="assets/logo.png" alt=""></div>
<div class="slide" id="s1"><h1>こんなお悩みは<br>ありませんか？</h1><p>（シーン1の本文）</p></div>
<div class="slide" id="s2"><h1>できること</h1><p>（シーン2の本文）</p></div>
<div class="slide" id="s3"><h1>まずは無料でお試しください</h1><p>（最終 CTA）</p></div>
</div>
<script>
// ナレーションの段落ごとの開始秒（音声を聞いて記入）。最後の要素は動画の終了秒
const timings = [
  { id: 's1', start: 0.0 },
  { id: 's2', start: 12.0 },
  { id: 's3', start: 40.0 },
];
window.totalSeconds = 52.0;   // = ナレーションの長さ（ffprobe）+ 末尾の余韻 1〜2 秒
const FADE = 0.6;             // クロスフェード秒

// 時刻 t の見た目を決定的に作る。アニメーションは t から直接計算し、タイマーに依存しない
window.seek = function (t) {
  for (let i = 0; i < timings.length; i++) {
    const el = document.getElementById(timings[i].id);
    const start = timings[i].start;
    const end = i + 1 < timings.length ? timings[i + 1].start : window.totalSeconds;
    let o = 0;
    if (t >= start && t < end) {
      o = Math.min(1, (t - start) / FADE);                       // フェードイン
      if (end - t < FADE) o = Math.min(o, (end - t) / FADE);     // フェードアウト
    }
    el.style.opacity = o;
    // 例: シーン内でゆっくりズーム（1.00 → 1.03）
    const p = Math.max(0, Math.min(1, (t - start) / (end - start)));
    el.style.transform = 'scale(' + (1 + 0.03 * p).toFixed(4) + ')';
  }
};
window.ready = document.fonts ? document.fonts.ready.then(() => true) : Promise.resolve(true);
window.seek(0);
</script>
</body></html>
